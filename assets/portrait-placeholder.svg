<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" width="150" height="200" role="img" aria-label="Portrait placeholder, hatched: photo to be supplied">
  <!-- Provenance: authored by hand for this site as a labeled placeholder. Replace with assets/portrait.jpg. -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a94a0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="148" height="198" fill="#f6f7f4" stroke="#15181c" stroke-width="2"/>
  <rect x="7" y="7" width="136" height="186" fill="url(#hatch)"/>
  <rect x="22" y="84" width="106" height="34" fill="#f6f7f4" stroke="#15181c" stroke-width="1"/>
  <text x="75" y="98" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="11" letter-spacing="1" fill="#15181c">PORTRAIT</text>
  <text x="75" y="111" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="500" font-size="9" letter-spacing="0.8" fill="#4b535d">TO BE SUPPLIED</text>
</svg>
